<text x="364.0" y="84" font-size="10" text-anchor="middle" fill="#8b93a3">full here → drop</text>
<text x="364.0" y="36" font-size="13" text-anchor="middle" fill="#e6e6e6" font-weight="700">router queue = you</text>
