<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Dumbbell topology: four senders feed one router queue, which drains over a bottleneck link to the receivers; ACKs return on an uncongested path.">
